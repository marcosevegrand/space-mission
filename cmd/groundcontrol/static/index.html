<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Ground Control</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        body{font-family:system-ui,Arial;margin:16px;max-width:1100px}
        header{display:flex;align-items:center;gap:12px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
        .card{border:1px solid #e6e6e6;padding:12px;border-radius:8px;background:#fff}
        pre{white-space:pre-wrap;font-size:12px}
        .small{font-size:12px;color:#666}
    </style>
    </head>
    <body>
    <header>
        <h1>Ground Control</h1>
        <div class="small">Realtime telemetry & missions</div>
    </header>

    <div class="grid">
        <div class="card">
        <h2>Rovers</h2>
        <div id="rovers"></div>
        </div>

        <div class="card">
        <h2>Missions</h2>
        <div id="missions"></div>
        </div>
    </div>

    <script>
        // API host configuration: change if mothership runs elsewhere
        window.API_HOST = window.API_HOST || 'http://localhost:8080'
    </script>
    <script src="app.js"></script>
</body>
</html>
