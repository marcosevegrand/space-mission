<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ground Control - Mission Commander</title>
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <a href="missoes.html" class="btn-secondary">Ver lista de Missões</a>
                <h1 class="title">🛰️ GROUND CONTROL</h1>
                <p class="subtitle">Mission Commander - Real-time Rover Monitoring</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Sidebar - Quick Stats, Rovers, Missions -->
            <aside class="sidebar-left">
                <div class="panel">
                    <h2 class="panel-title">QUICK STATS</h2>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-label">Active Rovers</span>
                            <span class="stat-value" id="activeRovers">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Active Missions</span>
                            <span class="stat-value" id="activeMissions">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">System Health</span>
                            <span class="stat-value healthy" id="systemHealth">100%</span>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h2 class="panel-title">ROVERS</h2>
                    <div class="rovers-list" id="roversList">
                        <!-- Rovers will be populated here -->
                    </div>
                </div>

                <div class="panel">
                    <h2 class="panel-title">MISSÕES</h2>
                    <div class="missions-list" id="missionsList">
                        <!-- Missions will be populated here -->
                    </div>
                </div>
            </aside>

            <!-- Center Content -->
            <section class="center-content">
                <!-- Map Section -->
                <div class="panel panel-large">
                    <h2 class="panel-title">MISSION MAP</h2>
                    <canvas id="mapCanvas" class="map-canvas"></canvas>
                </div>
            </section>

            <!-- Right Sidebar -->
            <aside class="sidebar-right">
                <!-- Place for future: Alerts, other panels -->
            </aside>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <span id="lastUpdate">Last Update: --:--:--</span>
                <span class="separator">|</span>
                <span id="uptime">Uptime: 00:00:00</span>
                <span class="separator">|</span>
                <button class="btn-secondary" onclick="location.reload()">Refresh Data</button>
            </div>
        </footer>
    </div>

    <script src="static/app.js"></script>
</body>
</html>
